<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Can a Tiny Brain Plan? Reconstructing a Predatory Detour in the Jumping Spider Portia labiata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
/* Layout and palette from portia-wild-hunt (docs/index.html): identity bar on
   top, 3D stage taking the room, transport rail beneath. */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --ink: #16202a;
  --muted: #5c6b78;
  --line: #cfd8de;
  --accent: #b4531f;
  --accent-ink: #ffffff;
  --stage: #000000;
  --on-stage: #c3cdd6;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161b;
    --surface: #171f26;
    --ink: #e6edf2;
    --muted: #90a1ad;
    --line: #27333c;
    --accent: #e0873f;
    --accent-ink: #15100a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161b;
  --surface: #171f26;
  --ink: #e6edf2;
  --muted: #90a1ad;
  --line: #27333c;
  --accent: #e0873f;
  --accent-ink: #15100a;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
}
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: 12px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}

/* view buttons at the left, title centred on the page */
.bar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 44rem) minmax(0, 1fr);
  align-items: center;
  gap: 8px 16px;
}
.bar .views { grid-column: 1; grid-row: 1; justify-self: start; }
.bar h1 { grid-column: 2; grid-row: 1; text-align: center; }
.nowrap { white-space: nowrap; }
@media (max-width: 1280px) {
  .bar { grid-template-columns: minmax(0, 1fr); }
  .bar h1 { grid-column: 1; grid-row: 1; }
  .bar .views { grid-column: 1; grid-row: 2; }
}
.views { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.views .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 3px; }
h1 em { font-style: italic; font-weight: inherit; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(17px, 2.4vw, 21px);
  letter-spacing: -0.01em;
  margin: 0;
  text-wrap: balance;
}

.btn {
  font: 500 12.5px/1 var(--font-body);
  color: var(--accent-ink);
  background: var(--accent);
  border: 1px solid transparent;
  border-radius: 3px;
  padding: 8px 13px;
  cursor: pointer;
  white-space: nowrap;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn:hover { filter: brightness(1.08); }
:is(.btn, input, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.speeds, .steps { display: flex; gap: 5px; }

.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 220px;
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
  background: var(--stage);
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hint {
  position: absolute;
  left: 10px;
  bottom: 8px;
  font-family: var(--font-data);
  font-size: 10.5px;
  color: var(--on-stage);
  opacity: 0.75;
  pointer-events: none;
}
.status[hidden] { display: none; }
.status {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 10px;
  padding: 24px;
  text-align: center;
  color: var(--on-stage);
  font-family: var(--font-data);
  font-size: 12px;
  white-space: pre-line;
  pointer-events: none;
}
.status .track { width: 220px; height: 3px; background: rgba(255, 255, 255, 0.12); border-radius: 2px; overflow: hidden; }
.status .fill { height: 100%; width: 0; background: var(--accent); }

.panel {
  position: absolute;
  top: 10px;
  left: 10px;
  width: min(272px, calc(100% - 20px));
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  border: 1px solid var(--line);
  border-radius: 4px;
  font-size: 12px;
  overflow: hidden;
}
.panel summary {
  cursor: pointer;
  padding: 7px 10px;
  font-family: var(--font-data);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  list-style: none;
}
.panel summary::-webkit-details-marker { display: none; }
.panel summary::before { content: "▸ "; display: inline-block; }
.panel[open] summary::before { content: "▾ "; }
.panel .body { max-height: min(52vh, 380px); overflow-y: auto; padding: 0 10px 9px; }
.panel .row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 2px 0;
  min-width: 0;
  cursor: pointer;
}
.panel .row.off { opacity: 0.45; cursor: default; }
.panel .row input { accent-color: var(--accent); flex: none; margin: 0; }
.panel .row span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-data);
  font-size: 11px;
}

.rail {
  display: flex;
  align-items: center;
  gap: 10px 14px;
  flex-wrap: wrap;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
}
#play { min-width: 64px; }
.time {
  font-family: var(--font-data);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.phase {
  font-family: var(--font-data);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  white-space: nowrap;
  min-width: 13em;
}

/* the timeline, coloured by behavioural phase */
#scrub { position: relative; flex: 1 1 220px; min-width: 140px; height: 26px; cursor: pointer; touch-action: none; }
#strip { position: absolute; left: 0; right: 0; top: 9px; height: 8px; display: flex; border-radius: 2px; overflow: hidden; }
#strip div { height: 100%; }
#head { position: absolute; top: 3px; width: 3px; height: 20px; margin-left: -1.5px; border-radius: 1px;
  background: var(--ink); box-shadow: 0 0 0 1px var(--surface); pointer-events: none; }
.mark { position: absolute; top: 4px; height: 18px; border-left: 1px dashed var(--muted); pointer-events: none; }
.mark b { position: absolute; top: -11px; left: 3px; font: 500 9.5px var(--font-data); color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }

@media (max-width: 520px) {
  .time { font-size: 11px; }
  .rail { gap: 8px 10px; }
  .phase { min-width: 0; }
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="views" id="views">
      <button class="btn ghost" id="vFit" type="button">Overview</button>
      <button class="btn ghost" id="vAttack" type="button" title="A moment before the strike, from in front of the web, looking at Portia">Attack</button>
      <button class="btn ghost" id="vFollow" type="button">Follow Portia</button>
      <button class="btn ghost" id="vPrey" type="button">From the prey</button>
      <span class="sep"></span>
      <span id="figs" class="views"></span>
    </div>
    <h1>Can a Tiny Brain Plan? Reconstructing a Predatory Detour in the <span class="nowrap">Jumping Spider</span> <em>Portia labiata</em></h1>
  </div>

  <div class="stage" id="stage">
    <details class="panel" id="panel" open>
      <summary>Toggle objects</summary>
      <div class="body"><div id="layers"></div></div>
    </details>
    <div class="status" id="status"><div id="statusText">Loading…</div><div class="track"><div class="fill" id="fill"></div></div></div>
    <div class="hint">drag to orbit · scroll to zoom · right-drag to pan</div>
  </div>

  <div class="rail">
    <button class="btn" id="play" type="button">Play</button>
    <div class="steps">
      <button class="btn ghost" id="stepBack" type="button" title="Back one frame (&#8592; key; Shift+&#8592; 10 s)">&#9664;&#xFE0E; Step</button>
      <button class="btn ghost" id="stepFwd" type="button" title="Forward one frame (&#8594; key; Shift+&#8594; 10 s)">Step &#9654;&#xFE0E;</button>
    </div>
    <div id="scrub" role="slider" aria-label="Timeline"><div id="strip"></div><div id="head"></div></div>
    <span class="time" id="clock">00:00 / 00:00</span>
    <span class="phase" id="phase"></span>
    <div class="speeds" id="speeds">
      <button class="btn ghost" type="button" data-speed="1">1×</button>
      <button class="btn ghost" type="button" data-speed="10">10×</button>
      <button class="btn ghost active" type="button" data-speed="50">50×</button>
      <button class="btn ghost" type="button" data-speed="100">100×</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
(function () {
  "use strict";

  // animation_final_webgl.glb, Draco-compressed by draco_glb.py and slimmed by
  // slim_glb.py down to the four clips that move anything: Portia_merged_track,
  // Portia_Walk, ArmatureAction.001 and Spider_bodyAction. The six dropped were
  // the two _prev copies of the attack, Portia_Approach (one pose),
  // Armature_Path_Follow (two keys) and the AveragedTrajectoryCorrectEmpty
  // tracks, which drive an empty nothing hangs off.
  // animation_final_foliage.glb is the same with the foliage swapped for
  // foliage_glb.glb: the old scan and Portia_seen_patches have no mesh any more,
  // and '..._prey_seen' carries the plant once, with the prey's view in _SEEN.
  // The spider mesh is welded (760 k vertices, not 4.28 M) and has no normals,
  // so it is drawn flat-shaded, as it was in Blender.
  // animation_final_small.glb still loads with the old foliage.
  //
  // PUBLISH THE RELEASE BEFORE PUSHING, not after. deploy.yml runs both on a
  // push touching docs/ and on a release, and a Pages deployment is keyed by
  // pages_build_version, which is the commit SHA. Two runs on one commit
  // therefore claim the same deployment id and Pages keeps the FIRST. On v3.0
  // the push ran first, fetched the then-latest v2.1 asset
  // (portia_blended_small.glb) into docs/ and deployed; the release run
  // fetched the right files eight seconds later and was silently discarded.
  // The site served this page asking for a model that was not there.
  var MODEL_URL = "animation_final_foliage.glb";
  var DRACO_PATH = "draco/";

  // Everything below is in seconds of hunt time. The file's own clip times are
  // scene frames / 10, because Scene.001 plays at 10 fps while every key was
  // authored at 30, so one second of hunt is three seconds of clip.
  var FILE_PER_S = 3;
  var FRAME_S = 1 / 30;       // one video frame, for the Step buttons

  // The hand-off, scene frame 62431 at 30 fps: Portia_Walk ends and the attack
  // rig (ArmatureAction.001) takes over. The export is in ACTION mode, so the
  // attack clip starts at 0 rather than at its NLA strip's frame. Not marked on
  // the timeline; it falls inside "Pitch + roll".
  var HANDOFF = 62431 / 30;

  // The attack is authored against 60 fps, so at 1x its strike lands four
  // minutes after the tracks end. 2x puts it at about 38:37, a few seconds
  // after the recorded track stops; webgl_viewer.html uses the same value.
  var ATTACK_RATE = 2;

  // Joint crossfade at the hand-off (Blender's NLA blend-in, which an ACTION
  // export drops), and how long before it the body eases from the carrier's
  // last pose to the attack's first, 1.23 units away.
  var CROSSFADE_S = 1.0;
  var CONVERGE_S = 10.0;

  // Behavioural phases, from combined_track.csv (seconds). Colours are the
  // Portia_track phase materials' emission, in sRGB.
  var PHASES = [
    ["Start", 0, 54, "#ffdab3"],
    ["Aggressive mimicry", 54, 492, "#4ae897"],
    ["Reroute", 492, 732, "#defcfc"],
    ["Hesitant jump", 732, 816, "#e8c6e5"],
    ["Crawl behind leaf", 816, 1103, "#eeeaa1"],
    ["Crawl up leaf (saltatory stalk)", 1103, 2069, "#b7c9fb"],
    ["Pitch + roll", 2069, 2313, "#e5e5e5"],
    ["Strike and eating", 2313, Infinity, "#d23c2e"]     // red from the strike itself, see buildStrip
  ];

  // The Argiope point cloud. Blender's glTF exporter drops loose vertices, so
  // spider_filtered leaves only an empty node in the model; this is its
  // render_region group clipped to the Discoid swept 2 mm along its normal
  // (clip_points_to_discoid.py), 629,093 points written as a POINTS primitive
  // already in world space, colours linear in COLOR_0. A copy of
  // viewer/portia_points.glb.
  var POINTS_URL = "argiope_points.glb";
  var POINT_SIZE_PX = 0.5;    // screen pixels; points are ~0.025 mm apart

  var FOLIAGE = "9_mil_smoothened_edges_+_thickened_prey_seen";
  // The red tint on the foliage the prey can see is all or nothing, and goes
  // on and off with the prey's visual volume (the layer marked `seen` below).
  var SEEN_STRENGTH = 1.0;

  // Panel rows: label, node names as in the file, on at load.
  var LAYERS = [
    { label: "Foliage scan", nodes: [FOLIAGE], on: true },
    { label: "Web", nodes: ["WebDrawing", "Stabilimentum"], on: true },
    { label: "Trajectory, by phase", nodes: ["Portia_track"], on: true },
    { label: "Prey's visual volume and what it can see", nodes: ["PreyEyes"], on: false, seen: true },
    { label: "Shortest jump path", nodes: ["JumpPath_walk", "JumpPath_jump"], on: false }
  ];
  // hidden, and no row in the panel: the SfM-tracked body and the alignment video frame
  var HIDE_ALWAYS = ["SfM_Root", "AlignPhotoPlane"];
  var WEB_OPACITY = 0.2;
  var WEB_MESHES = ["WebDrawing_Solid", "WebDrawing_Anchors_Solid", "Stabilimentum_Solid"];
  var UNLIT = [FOLIAGE];      // photo textures

  // ------------------------------------------------------------------ scene
  var stage = document.getElementById("stage");
  function stageSize() { return [Math.max(1, stage.clientWidth), Math.max(1, stage.clientHeight)]; }
  // The foliage is 9 M triangles, so pixels matter: by default draw at one
  // device pixel per CSS pixel.
  var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.insertBefore(renderer.domElement, stage.firstChild);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  var camera = new THREE.PerspectiveCamera(45, 1, 0.05, 5000);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444040, 1.0));
  var sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(1, 2, 1.5);
  scene.add(sun);

  // sized to the stage, not the window: the bar and rail take their share
  function resize() {
    var s = stageSize();
    camera.aspect = s[0] / s[1];
    if (figure) camera.fov = fovFor(figure);
    camera.updateProjectionMatrix();
    renderer.setSize(s[0], s[1], false);
    markDirty();
  }
  new ResizeObserver(resize).observe(stage);

  // GLTFLoader sanitises node names ("Portia - Merged.001" -> "Portia_-_Merged001")
  // but keeps the original in userData.name.
  function find(root, name) {
    var s = String(name).replace(/\s/g, "_").replace(/[\[\]\.:\/]/g, "");
    var hit = root.getObjectByName(name) || root.getObjectByName(s);
    if (!hit) root.traverse(function (o) { if (!hit && o.userData.name === name) hit = o; });
    return hit;
  }

  // ------------------------------------------------------------------ state
  var root, mixer, carrier, armature, spiderPoint, preyEyes;
  var act = {};
  var bind = new THREE.Matrix4(), parentInv = new THREE.Matrix4();
  var attackStart = { p: new THREE.Vector3(), q: new THREE.Quaternion(), s: new THREE.Vector3() };
  var tNow = 0, tEnd = 1, playing = false, strikeAt = null, speed = 50;
  var camMode = "orbit";
  var fitBox = new THREE.Box3();
  var lastSpider = new THREE.Vector3();

  var statusEl = document.getElementById("status");
  function status(msg, frac) {
    document.getElementById("statusText").textContent = msg;
    if (frac != null) document.getElementById("fill").style.width = (100 * frac).toFixed(1) + "%";
  }

  // ------------------------------------------------------------------ load
  var loader = new THREE.GLTFLoader();
  var draco = new THREE.DRACOLoader();
  draco.setDecoderPath(DRACO_PATH);
  draco.setWorkerLimit(1);
  loader.setDRACOLoader(draco);
  // After the download the geometry still has to be decompressed (about 15 s
  // for the 5.5 M-vertex scan), with nothing to report progress by; a decoder
  // that dies in its worker never answers at all.
  var watchdog = null;
  loader.load(MODEL_URL, function (g) { clearTimeout(watchdog); onLoad(g); }, function (e) {
    var mb = (e.loaded / 1e6).toFixed(0);
    if (e.total && e.loaded >= e.total) {
      status("Decompressing geometry… (usually under a minute)", 1);
      clearTimeout(watchdog);
      watchdog = setTimeout(function () {
        status("Still decompressing after 3 minutes - the decoder has probably failed.\nSee the browser console (F12).");
      }, 180000);
    } else if (e.total) status("Loading model… " + mb + " / " + (e.total / 1e6).toFixed(0) + " MB", e.loaded / e.total);
    else status("Loading model… " + mb + " MB");
  }, function (err) {
    clearTimeout(watchdog);
    status(location.protocol === "file:"
      ? "Serve the docs folder over http (python3 -m http.server -d docs), not as a file."
      : "Could not load " + MODEL_URL + ": " + (err && err.message || err));
    console.error(err);
  });

  function onLoad(gltf) {
    status("Preparing…", 1);
    root = gltf.scene;
    scene.add(root);
    prepareMaterials();
    buildLayers();

    carrier = find(root, "Portia_blended_carrier");
    armature = find(root, "Armature");
    preyEyes = find(root, "PreyEyes");
    spiderPoint = find(root, "C") || armature;     // the body's root bone
    root.traverse(function (o) { if (o.isSkinnedMesh) o.frustumCulled = false; });

    // The spider follows the carrier through a Blender constraint that glTF
    // cannot carry. The export's rest transforms hold the two at their t = 0
    // offset (2.03 units), so that offset is the bind.
    root.updateMatrixWorld(true);
    bind.copy(carrier.matrixWorld).invert().multiply(armature.matrixWorld);
    parentInv.copy(armature.parent.matrixWorld).invert();

    setupClips(gltf.animations);

    var foliage = find(root, FOLIAGE);
    fitBox.setFromObject(foliage || root);
    fit();
    buildStrip();
    applyTime(0);
    statusEl.hidden = true;
    markDirty();
    loadPoints();
  }

  function loadPoints() {
    if (!POINTS_URL) return;
    loader.load(POINTS_URL, function (g) {
      var mat = new THREE.PointsMaterial({ size: POINT_SIZE_PX, sizeAttenuation: false, vertexColors: true });
      var n = 0;
      g.scene.traverse(function (o) {
        if (!o.isPoints) return;
        o.material = mat;
        n += o.geometry.attributes.position.count;
      });
      scene.add(g.scene);           // always shown, no row in the panel
      preyBox.setFromObject(g.scene);
      markDirty();
      console.log("points: " + n.toLocaleString() + " from " + POINTS_URL);
    }, undefined, function (err) {
      console.warn("no point cloud (" + POINTS_URL + "): " + (err && err.message || err));
    });
  }

  function prepareMaterials() {
    WEB_MESHES.forEach(function (n) {
      var o = find(root, n);
      if (!o) return;
      o.material = new THREE.MeshBasicMaterial({ color: 0xf4f2ea, transparent: true,
        opacity: WEB_OPACITY, side: THREE.DoubleSide, depthWrite: false });
      o.renderOrder = 2;
    });
    UNLIT.forEach(function (n) {
      var o = find(root, n);
      if (!o) return;
      o.traverse(function (m) {
        if (!m.isMesh) return;
        var old = m.material;
        m.material = new THREE.MeshBasicMaterial({ map: old.map, color: old.color,
          vertexColors: old.vertexColors, side: THREE.DoubleSide });
      });
    });
    // The prey's view: _SEEN, one normalised byte a vertex, 1 where the prey can
    // see it (from COLOR_1's alpha in the export; the two colour layers were 12
    // bytes a vertex over 5.5 M vertices, more than the Draco decoder could hold,
    // so it failed and the page sat after the download). Red over the photo.
    var fol = find(root, FOLIAGE);
    if (fol) fol.traverse(function (m) {
      var flag = m.isMesh && m.geometry.getAttribute("_seen");
      if (!flag) return;
      m.geometry.setAttribute("seen", flag);      // no leading underscore in GLSL
      m.geometry.deleteAttribute("_seen");
      m.material.onBeforeCompile = function (sh) {
        sh.uniforms.uSeen = seenUniform;
        sh.vertexShader = "attribute float seen;\nvarying float vSeen;\n" + sh.vertexShader
          .replace("#include <begin_vertex>", "#include <begin_vertex>\n  vSeen = seen;");
        sh.fragmentShader = "uniform float uSeen;\nvarying float vSeen;\n" + sh.fragmentShader
          .replace("#include <map_fragment>", "#include <map_fragment>\n"
            + "  diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 0.35 + vec3(0.75, 0.05, 0.03), vSeen * uSeen);");
      };
      m.material.needsUpdate = true;
    });
    var vol = find(root, "PreyVisualVolume");
    if (vol) { vol.material.depthWrite = false; vol.renderOrder = 3; }
  }

  // ------------------------------------------------------------------ clips
  function setupClips(clips) {
    mixer = new THREE.AnimationMixer(root);
    function clip(name) {
      var c = clips.find(function (k) { return k.name === name; });
      if (!c) console.warn("no clip " + name);
      return c;
    }
    function action(c) {
      var a = mixer.clipAction(c);
      a.setLoop(THREE.LoopOnce, 1);
      a.clampWhenFinished = true;
      a.play();
      return a;
    }
    var attack = clip("ArmatureAction.001");
    var prefix = armature.name + ".";
    // The Armature's own tracks come in at full weight at the hand-off; only
    // the bones crossfade, or the body would be averaged with its rest pose.
    var bodyTracks = attack.tracks.filter(function (t) { return t.name.indexOf(prefix) === 0; });
    var poseTracks = attack.tracks.filter(function (t) { return t.name.indexOf(prefix) !== 0; });
    act.carrier = action(clip("Portia_merged_track"));
    act.walk = action(clip("Portia_Walk"));
    act.pose = action(new THREE.AnimationClip("attack_pose", attack.duration, poseTracks));
    act.body = action(new THREE.AnimationClip("attack_body", attack.duration, bodyTracks));
    var sfm = clip("Spider_bodyAction");
    if (sfm) act.sfm = action(sfm);

    tEnd = HANDOFF + attack.duration / (FILE_PER_S * ATTACK_RATE);
    var carrierEnd = act.carrier.getClip().duration / FILE_PER_S;
    tEnd = Math.max(tEnd, carrierEnd);

    // the attack's first pose, in world space, for the run-in to the hand-off
    act.body.time = 0; act.body.setEffectiveWeight(1);
    mixer.update(0);
    armature.updateMatrixWorld(true);
    armature.matrixWorld.decompose(attackStart.p, attackStart.q, attackStart.s);

    // the strike: the largest single step the attack moves the body
    var pos = bodyTracks.find(function (t) { return /\.position$/.test(t.name); });
    if (pos) {
      var best = 0, at = 0, v = pos.values;
      for (var i = 3; i < v.length; i += 3) {
        var d = Math.hypot(v[i] - v[i - 3], v[i + 1] - v[i - 2], v[i + 2] - v[i - 1]);
        if (d > best) { best = d; at = pos.times[i / 3]; }
      }
      strikeAt = HANDOFF + at / (FILE_PER_S * ATTACK_RATE);
    }
  }

  var _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3();
  function smooth(x) { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }

  function applyTime(t) {
    tNow = Math.min(Math.max(t, 0), tEnd);
    var f = tNow * FILE_PER_S;
    var a = Math.max(0, tNow - HANDOFF) * FILE_PER_S * ATTACK_RATE;
    var w = smooth((tNow - HANDOFF) / CROSSFADE_S);
    act.carrier.time = f;
    if (act.sfm) act.sfm.time = f;
    act.walk.time = Math.min(f, act.walk.getClip().duration);
    act.pose.time = a;
    act.body.time = a;
    act.walk.setEffectiveWeight(1 - w);
    act.pose.setEffectiveWeight(w);
    act.body.setEffectiveWeight(tNow >= HANDOFF ? 1 : 0);
    mixer.update(0);

    if (tNow < HANDOFF) {
      carrier.updateMatrixWorld(true);
      _m.multiplyMatrices(carrier.matrixWorld, bind);
      var k = smooth((tNow - (HANDOFF - CONVERGE_S)) / CONVERGE_S);
      if (k > 0) {
        _m.decompose(_p, _q, _s);
        _p.lerp(attackStart.p, k);
        _q.slerp(attackStart.q, k);
        _s.lerp(attackStart.s, k);
        _m.compose(_p, _q, _s);
      }
      _m.premultiply(parentInv);
      _m.decompose(armature.position, armature.quaternion, armature.scale);
    }
    root.updateMatrixWorld(true);
    updateBar();
  }

  // ------------------------------------------------------------------ panel
  var seenUniform = { value: 0 };
  function layerRow(label, checked, enabled) {
    var row = document.createElement("label");
    row.className = "row" + (enabled ? "" : " off");
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = checked && enabled;
    cb.disabled = !enabled;
    var span = document.createElement("span");
    span.textContent = label;
    span.title = label;
    row.appendChild(cb);
    row.appendChild(span);
    return row;
  }
  function buildLayers() {
    var box = document.getElementById("layers");
    LAYERS.forEach(function (L) {
      var objs = L.nodes.map(function (n) { return find(root, n); }).filter(Boolean);
      var row = layerRow(L.label, L.on, objs.length > 0);
      var cb = row.querySelector("input");
      box.appendChild(row);
      function set() {
        objs.forEach(function (o) { o.visible = cb.checked; });
        if (L.seen) seenUniform.value = cb.checked ? SEEN_STRENGTH : 0;
      }
      cb.addEventListener("change", set);
      set();
    });
    HIDE_ALWAYS.forEach(function (n) { var o = find(root, n); if (o) o.visible = false; });
  }

  // ------------------------------------------------------------------ timeline
  var scrub = document.getElementById("scrub");
  function buildStrip() {
    var strip = document.getElementById("strip");
    // red starts at the strike itself (about 4 s after the csv's 2313 s), so
    // Pitch + roll runs up to it
    if (strikeAt != null) {
      PHASES[PHASES.length - 2][2] = strikeAt;
      PHASES[PHASES.length - 1][1] = strikeAt;
    }
    PHASES.forEach(function (p) {
      var a = Math.min(p[1], tEnd), b = Math.min(p[2], tEnd);
      if (b <= a) return;
      var d = document.createElement("div");
      d.style.width = (100 * (b - a) / tEnd) + "%";
      d.style.background = p[3];
      d.title = p[0];
      strip.appendChild(d);
    });
    if (strikeAt != null) {
      var el = document.createElement("div");
      el.className = "mark";
      el.style.left = (100 * strikeAt / tEnd) + "%";
      el.innerHTML = "<b>strike</b>";
      scrub.appendChild(el);
    }
  }
  function mmss(t) {
    t = Math.max(0, Math.round(t));
    return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
  }
  function updateBar() {
    document.getElementById("head").style.left = (100 * tNow / tEnd) + "%";
    document.getElementById("clock").textContent = mmss(tNow) + " / " + mmss(tEnd);
    var ph = PHASES.find(function (p) { return tNow >= p[1] && tNow < p[2]; });
    document.getElementById("phase").textContent = ph ? ph[0] : "";
  }
  function seekFromEvent(e) {
    var r = scrub.getBoundingClientRect();
    applyTime(tEnd * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)));
  }
  scrub.addEventListener("pointerdown", function (e) {
    if (!mixer) return;
    scrub.setPointerCapture(e.pointerId);
    seekFromEvent(e);
    scrub.onpointermove = seekFromEvent;
  });
  scrub.addEventListener("pointerup", function () { scrub.onpointermove = null; });

  var playBtn = document.getElementById("play");
  function setPlaying(p) {
    playing = p;
    if (p && tNow >= tEnd) applyTime(0);
    playBtn.textContent = p ? "Pause" : "Play";
  }
  function step(dt) { if (!mixer) return; setPlaying(false); applyTime(tNow + dt); }
  playBtn.addEventListener("click", function () { if (mixer) setPlaying(!playing); });
  document.getElementById("stepBack").addEventListener("click", function () { step(-FRAME_S); });
  document.getElementById("stepFwd").addEventListener("click", function () { step(FRAME_S); });
  window.addEventListener("keydown", function (e) {
    if (!mixer || e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
    else if (e.code === "ArrowRight") step(e.shiftKey ? 10 : FRAME_S);
    else if (e.code === "ArrowLeft") step(e.shiftKey ? -10 : -FRAME_S);
  });
  document.querySelectorAll("#speeds .btn").forEach(function (b) {
    b.addEventListener("click", function () {
      speed = +b.dataset.speed;
      document.querySelectorAll("#speeds .btn").forEach(function (o) { o.classList.toggle("active", o === b); });
    });
  });

  // ------------------------------------------------------------------ camera
  var modeBtns = { orbit: null, follow: document.getElementById("vFollow"), prey: document.getElementById("vPrey") };
  function setMode(m) {
    if (m !== "fixed") leaveFigure();
    camMode = m;
    Object.keys(modeBtns).forEach(function (k) { if (modeBtns[k]) modeBtns[k].classList.toggle("active", k === m); });
    controls.enabled = m !== "prey" && m !== "fixed";
    if (m === "follow" && spiderPoint) {
      spiderPoint.getWorldPosition(lastSpider);
      var off = camera.position.clone().sub(controls.target);
      var r = Math.min(off.length(), 40);
      controls.target.copy(lastSpider);
      camera.position.copy(lastSpider).add(off.setLength(r));
    }
  }
  function fit() { showFigure(OVERVIEW); }
  var fitBtn = document.getElementById("vFit");
  fitBtn.title = "Fig 1: PlaneCamera, looking at the web plane";
  fitBtn.addEventListener("click", fit);
  // ---- Attack: ATTACK_VIEW.before seconds ahead of the strike, from just in
  // front of the web near Argiope and out to the right, looking at Portia and
  // orbiting her. "Front" and "right" are as the Overview (Fig 1) camera sees
  // the web: front is its side of the web, right is its screen right. Distances
  // in scene units (mm), measured from the centre of the Argiope point cloud.
  var ATTACK_VIEW = { before: 1.0, front: 20, right: 12, up: 4 };
  var preyBox = new THREE.Box3();
  function showAttack() {
    if (!mixer || strikeAt == null) return;
    setPlaying(false);
    applyTime(strikeAt - ATTACK_VIEW.before);
    setMode("orbit");
    var p0 = new THREE.Vector3().fromArray(OVERVIEW.position);
    var fwd = new THREE.Vector3().fromArray(OVERVIEW.target).sub(p0).normalize();
    var up = new THREE.Vector3().fromArray(OVERVIEW.up).normalize();
    var right = fwd.clone().cross(up).normalize();
    var prey = preyBox.isEmpty() ? find(root, "Goal").getWorldPosition(new THREE.Vector3())
                                 : preyBox.getCenter(new THREE.Vector3());
    var portia = spiderPoint.getWorldPosition(new THREE.Vector3());
    camera.position.copy(prey)
      .addScaledVector(fwd, -ATTACK_VIEW.front)
      .addScaledVector(right, ATTACK_VIEW.right)
      .addScaledVector(up, ATTACK_VIEW.up);
    controls.target.copy(portia);
    lastSpider.copy(portia);
    controls.update();
    markDirty();
  }
  document.getElementById("vAttack").addEventListener("click", showAttack);
  modeBtns.follow.addEventListener("click", function () { setMode(camMode === "follow" ? "orbit" : "follow"); });
  modeBtns.prey.addEventListener("click", function () { setMode(camMode === "prey" ? "orbit" : "prey"); });

  // The figure cameras, from glb_export_ready_gait_blended.blend (parented to
  // Camera_Prop.001), in glTF's Y-up world. That file and the current scene
  // share a frame - the same scan vertices land at the same world positions -
  // so these are the figures' viewpoints here too; only the prey objects were
  // re-placed since (by ~3 units). `up` keeps each camera's roll and `hfov` its
  // horizontal field of view (the renders were 1920 x 1080, sensor fit AUTO),
  // so the framing matches the figure across the width at any window shape.
  // There is no Fig 3A camera in either .blend.
  // Fig 1 is PlaneCamera in aligned_11444_autosave_animation.blend, a child of
  // PlaneCamera_Rig on the web, aimed at the rig from 468 units: 74 mm lens on
  // a portrait 1080 x 1920 render, so its VERTICAL field of view is the one to
  // keep (`vfov`). (The gait file's camera named Fig1 is a different view.)
  // Fig 1's camera is the Overview button, and where the page opens.
  var OVERVIEW = { name: "Overview", position: [427.0452, 20.5508, -248.1759],
    target: [418.3637, 21.3296, -243.2743], up: [0.0678, 0.997, -0.0383], vfov: 46.77 };
  var FIGURES = [
    { name: "Fig 3C", position: [42.8374, 31.956, 20.9418], target: [39.1765, 22.8492, 22.8557],
      up: [-0.8071, 0.4131, 0.4219], hfov: 76.09 },
    { name: "Fig 3D back", note: "Back_Camera_Fig_D (hidden from render in Blender)",
      position: [-24.4835, 46.9336, 103.7819], target: [-20.1608, 44.3261, 95.1496],
      up: [0.1167, 0.9654, -0.2331], hfov: 69.38 }
  ];
  var DEFAULT_FOV = 45;
  var figure = null;          // the figure view being shown, or null

  // the vertical fov for this window that keeps the figure's fitted dimension
  function fovFor(f) {
    if (f.vfov) return f.vfov;
    return 2 * THREE.MathUtils.radToDeg(Math.atan(Math.tan(THREE.MathUtils.degToRad(f.hfov) / 2) / camera.aspect));
  }
  function showFigure(f) {
    setMode("fixed");
    figure = f;
    var p = new THREE.Vector3().fromArray(f.position);
    var fwd = new THREE.Vector3().fromArray(f.target).sub(p).normalize();
    camera.position.copy(p);
    camera.up.fromArray(f.up);
    camera.lookAt(p.clone().add(fwd));
    camera.fov = fovFor(f);
    camera.updateProjectionMatrix();
    // what orbiting will circle once you drag: the scene's centre, projected
    // onto the line of sight, so the hand-over does not swing the view
    var c = fitBox.getCenter(new THREE.Vector3());
    var d = Math.max(1, c.sub(p).dot(fwd));
    controls.target.copy(p).addScaledVector(fwd, d);
    figBtns.forEach(function (b) { b.classList.toggle("active", b.textContent === f.name); });
    fitBtn.classList.toggle("active", f === OVERVIEW);
    markDirty();
  }
  function leaveFigure() {
    if (!figure) return;
    figure = null;
    figBtns.forEach(function (b) { b.classList.remove("active"); });
    fitBtn.classList.remove("active");
    camera.up.set(0, 1, 0);           // OrbitControls assumes Y up
    camera.fov = DEFAULT_FOV;
    camera.updateProjectionMatrix();
    camMode = "orbit";
    controls.enabled = true;
  }
  var figBtns = FIGURES.map(function (f) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn ghost";
    b.textContent = f.name;
    if (f.note) b.title = f.note;
    b.addEventListener("click", function () { showFigure(f); });
    document.getElementById("figs").appendChild(b);
    return b;
  });
  // dragging or scrolling the view hands it back to the orbit camera
  renderer.domElement.addEventListener("pointerdown", function () { if (figure) leaveFigure(); }, true);
  renderer.domElement.addEventListener("wheel", function () { if (figure) leaveFigure(); }, true);

  var _sp = new THREE.Vector3();
  function updateCamera() {
    if (!spiderPoint) return;
    spiderPoint.getWorldPosition(_sp);
    if (camMode === "follow") {
      var d = _sp.clone().sub(lastSpider);
      controls.target.add(d);
      camera.position.add(d);
    } else if (camMode === "prey" && preyEyes) {
      preyEyes.getWorldPosition(camera.position);
      camera.lookAt(_sp);
    }
    lastSpider.copy(_sp);
    // near / far from the viewing distance, so millimetre detail keeps its depth precision
    var dist = camMode === "prey" ? camera.position.distanceTo(_sp) : camera.position.distanceTo(controls.target);
    camera.near = Math.max(0.01, dist / 500);
    camera.far = dist * 50 + 2000;
    camera.updateProjectionMatrix();
  }

  // ------------------------------------------------------------------ loop
  // Draw only when something changed: while playing, while the view moves
  // (including the damping glide after a drag), and after any panel input.
  // Paused and untouched, the GPU is left alone.
  var dirty = 2;
  function markDirty() { dirty = 2; }
  ["input", "change", "click", "keydown", "pointermove", "wheel"].forEach(function (ev) {
    window.addEventListener(ev, markDirty, { passive: true });
  });
  resize();
  var clock = new THREE.Clock();
  renderer.setAnimationLoop(function () {
    var dt = Math.min(clock.getDelta(), 0.1);
    if (mixer && playing) {
      applyTime(tNow + dt * speed);
      if (tNow >= tEnd) setPlaying(false);
      dirty = 2;
    }
    if (mixer) updateCamera();
    // not in a figure view: OrbitControls would level the camera's roll
    if (camMode !== "prey" && camMode !== "fixed" && controls.update()) dirty = 2;
    if (dirty > 0) {
      renderer.render(scene, camera);
      dirty--;
    }
  });
})();
</script>
</body>
</html>
