# Publishes docs/ to GitHub Pages. The model is not in git: it is attached to
# the latest GitHub Release and copied in here before the site is uploaded.
name: Deploy viewer

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the model from the latest release
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern Portia_web.glb --dir docs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
